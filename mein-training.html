<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Mein Training bei Lifesaving Baden.">
    <meta name="theme-color" content="#0f0f12">
    <meta name="color-scheme" content="dark">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lifesaving Baden">
    <title>Mein Training · Lifesaving Baden</title>
    <meta property="og:title" content="Mein Training · Lifesaving Baden">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://jp-gnad.github.io/Lifesaving-Baden/assets/img/lifesaving-baden-app-512.png">
    <link rel="icon" type="image/png" href="assets/img/lifesaving-baden-logo.png">
    <link rel="stylesheet" href="assets/css/styles.css?v=20261105-required-setup-v1">
    <link rel="stylesheet" href="assets/css/training.css?v=20261112-training-v1">
    <script defer src="assets/js/header.js?v=20261102-header-shadow-v1"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script defer src="assets/js/firebase-config.js?v=20261101-settings-v11"></script>
    <script defer src="assets/js/clubs-core.js?v=20261112-clubs-v1"></script>
    <script defer src="assets/js/person-link-store.js?v=20261112-responsible-v2"></script>
    <script defer src="assets/js/auth-core.js?v=20261105-required-setup-v1"></script>
    <script defer src="assets/js/admin-accounts.js?v=20261112-structure-v1"></script>
    <script defer src="assets/js/auth.js?v=20261112-structure-v1"></script>
  </head>
  <body class="auth-context-loading" data-page="training">
    <header class="site-header">
      <a class="brand" href="app.html" aria-label="Zum Mitgliederbereich">
        <span class="brand-mark"><img src="assets/img/lifesaving-baden-logo.png" alt=""></span>
        <span>Lifesaving Baden</span>
      </a>
      <nav class="nav" aria-label="Kontonavigation">
        <button class="account-trigger" type="button" data-account-open aria-label="Kontoprofil öffnen">
          <span class="account-avatar account-avatar-small">
            <img class="is-hidden" src="" alt="" data-account-photo-small>
            <span data-account-initials-small>?</span>
          </span>
          <span class="account-attention is-hidden" data-account-attention aria-hidden="true">!</span>
          <span class="account-linked is-hidden" data-link-indicator hidden aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </span>
        </button>
      </nav>
    </header>

    <main class="training-main">
      <p class="form-message" data-auth-error role="alert" hidden></p>
      <section class="training-heading is-hidden" data-athlete-only aria-labelledby="training-title">
        <img src="assets/img/training-app.svg" alt="">
        <h1 id="training-title">Mein Training</h1>
      </section>
    </main>

    <div class="account-overlay is-hidden" data-account-overlay aria-hidden="true">
      <section class="account-modal" role="dialog" aria-modal="true" aria-labelledby="account-title">
        <div class="account-modal-header"><p class="account-email" data-account-email></p><button class="account-close" type="button" data-account-close aria-label="Kontofenster schließen">×</button></div>
        <div class="account-avatar account-avatar-large"><img class="is-hidden" src="" alt="" data-account-photo-large><span data-account-initials-large>?</span></div>
        <h2 id="account-title"><span data-account-greeting-name>Mitglied</span></h2>
        <p class="account-name-line account-role-line">Status: <strong data-account-role></strong></p>
        <a class="button button-secondary account-manage" href="account-settings.html">
          <svg class="account-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
          <span>Kontoeinstellungen</span>
          <span class="account-manage-attention is-hidden" data-account-manage-attention aria-hidden="true" hidden>!</span>
        </a>
        <div class="account-actions"><button class="account-action" type="button" data-logout>Abmelden</button></div>
      </section>
    </div>
  </body>
</html>
