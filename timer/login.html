<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f12">
    <title>Anmelden · Lifesaving Baden</title>
    <link rel="icon" href="../assets/img/lifesaving-baden-logo.png">
    <link rel="stylesheet" href="../assets/css/styles.css?v=20260713-mobile-settings-menu-neutral">
    <script defer src="../assets/js/auth-core.js?v=20261101-shared-login-v1"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const { getLoginRedirectUrl, getSafeReturnUrl } = window.LifesavingAuth;
        const params = new URLSearchParams(window.location.search);
        const fallback = new URL("./#/", window.location.href);
        const target = new URL(getLoginRedirectUrl());
        target.searchParams.set("returnTo", getSafeReturnUrl(params.get("returnTo"), fallback).href);
        for (const flag of ["verified", "needsVerification"]) {
          if (params.has(flag)) target.searchParams.set(flag, "1");
        }
        window.location.replace(target.href);
      });
    </script>
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-panel">
        <p class="eyebrow">Lifesaving Baden</p>
        <h1>Zur Anmeldung</h1>
        <p>Du wirst zur gemeinsamen Anmeldung weitergeleitet.</p>
        <a class="button button-primary" href="../login.html?returnTo=timer%2F%23%2F">Anmeldung öffnen</a>
      </section>
    </main>
  </body>
</html>
