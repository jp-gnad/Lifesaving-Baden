<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f12">
    <link rel="manifest" href="../manifest.webmanifest?v=20261101-project-app-v1">
    <link rel="apple-touch-icon" href="../timer/app-icon-180.png?v=baden-brand-v1" sizes="180x180">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lifesaving Baden">
    <title>Anmelden · Lifesaving Baden</title>
    <link rel="icon" href="../assets/img/lifesaving-baden-logo.png">
    <link rel="stylesheet" href="../assets/css/styles.css?v=20261101-static-hover-v19">
    <script defer src="../assets/js/auth-core.js?v=20261105-account-setup-v12"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const { getLoginRedirectUrl } = window.LifesavingAuth;
        const params = new URLSearchParams(window.location.search);
        const target = new URL(getLoginRedirectUrl());
        for (const flag of ["verified", "needsVerification"]) {
          if (params.has(flag)) target.searchParams.set(flag, "1");
        }
        window.location.replace(target.href);
      });
    </script>
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-panel">
        <p class="eyebrow">Lifesaving Baden</p>
        <h1>Zur Anmeldung</h1>
        <p>Du wirst zur gemeinsamen Anmeldung weitergeleitet.</p>
        <a class="button button-primary" href="../login.html">Anmeldung öffnen</a>
      </section>
    </main>
  </body>
</html>
