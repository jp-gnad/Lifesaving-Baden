<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f9fc">
    <meta name="description" content="Einfache Zeitnahme für den Rettungssport">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Lifesaving Timer</title>
    <link rel="icon" href="./app-icon-64.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="./app-icon-180.png" sizes="180x180">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css?v=firebase-access-v5">
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script defer src="../assets/js/firebase-config.js?v=timer-firebase-v1"></script>
    <script defer src="./firestore-api.js?v=firebase-access-v5"></script>
    <script defer src="./app.js?v=firebase-access-v5"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/" aria-label="Lifesaving Timer – Startseite">
        <span class="brand-mark" aria-hidden="true"><img src="./app-icon-192.png" alt=""></span>
        <span>Lifesaving Timer</span>
      </a>
      <div class="header-actions">
        <a class="portal-link" id="timer-portal-link" href="../index.html">Lifesaving Baden</a>
        <div id="timer-account-control" class="timer-account-control" aria-live="polite"></div>
      </div>
    </header>
    <main id="app" class="container" tabindex="-1">
      <div class="loading">Wird geladen …</div>
    </main>
    <footer class="timer-site-footer">
      <span class="timer-footer-brand">
        <img src="../assets/img/elch-gelb.png" alt="" aria-hidden="true">
        Lifesaving Baden
      </span>
      <nav class="timer-footer-links" aria-label="Fußnavigation">
        <a href="../impressum.html">Impressum</a>
        <a href="../datenschutz.html">Datenschutz</a>
      </nav>
    </footer>
    <button id="offline-sync-status" class="offline-sync-status" type="button" aria-live="polite" hidden>
      <span class="offline-sync-dot" aria-hidden="true"></span>
      <span id="offline-sync-text">Ergebnis wartet</span>
    </button>
    <dialog id="timer-account-dialog" class="timer-account-dialog" aria-labelledby="timer-account-title">
      <button class="timer-account-close" type="button" data-timer-account-close aria-label="Kontofenster schließen">&times;</button>

      <p class="timer-account-email" data-timer-account-email>Keine E-Mail geladen.</p>

      <div class="timer-account-avatar timer-account-avatar-large" data-timer-account-avatar>?</div>

      <h2 id="timer-account-title"><span data-timer-account-name>Mitglied</span></h2>
      <p class="timer-account-name-line">Status: <strong data-timer-account-role>Sportler</strong></p>

      <a class="button secondary timer-account-manage" href="../account-settings.html">
        <svg class="timer-account-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 7h10"></path>
          <path d="M18 7h2"></path>
          <circle cx="16" cy="7" r="2"></circle>
          <path d="M4 17h2"></path>
          <path d="M10 17h10"></path>
          <circle cx="8" cy="17" r="2"></circle>
        </svg>
        <span>Kontoeinstellungen</span>
        <span class="timer-account-manage-attention" data-timer-account-manage-attention aria-hidden="true" hidden>!</span>
      </a>

      <div class="timer-account-actions">
        <button class="timer-account-action" id="timer-account-logout" type="button">
          <svg class="timer-account-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M10 17l5-5-5-5"></path>
            <path d="M15 12H3"></path>
            <path d="M14 4h4a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-4"></path>
          </svg>
          <span>Abmelden</span>
        </button>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="portrait-lock" role="alert" aria-live="assertive">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="8" width="24" height="44" rx="5"></rect><path d="M28 14h8M30 46h4M13 28a20 20 0 0 1 7-14m-7 14-5-5m5 5 5-5"></path></svg>
      <strong>Hochformat</strong><span>Bitte Gerät drehen.</span>
    </div>
  </body>
</html>
