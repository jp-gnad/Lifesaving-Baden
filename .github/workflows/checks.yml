name: Projekt prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Testwerkzeuge installieren
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install -r requirements-dev.txt
      - name: Struktur, Funktionen und Integration prüfen
        run: npm test
      - name: Berechtigungen im lokalen Demo-Emulator prüfen
        run: npm run test:rules
