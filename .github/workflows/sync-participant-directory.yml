name: Timer-Personenliste aktualisieren

on:
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Werkzeuge installieren
        run: |
          python -m pip install openpyxl==3.1.5
          npm install --no-save firebase-admin@^13.4.0

      - name: Quelldatei laden
        env:
          SOURCE_URL: ${{ secrets.PARTICIPANT_SOURCE_URL }}
        run: curl --fail --location --silent --show-error "$SOURCE_URL" --output "$RUNNER_TEMP/source.xlsx"

      - name: Suchliste erstellen
        run: python tools/build_participant_directory.py "$RUNNER_TEMP/source.xlsx" "$RUNNER_TEMP/participant-directory.json"

      - name: Firestore aktualisieren
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node tools/sync_participant_directory.mjs "$RUNNER_TEMP/participant-directory.json"
