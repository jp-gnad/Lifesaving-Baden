<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Admin-Kontenübersicht von Lifesaving Baden.">
    <meta name="theme-color" content="#0f0f12">
    <link rel="manifest" href="manifest.webmanifest?v=20261105-baden-icon-v2">
    <link rel="apple-touch-icon" href="assets/img/lifesaving-baden-app-180.png" sizes="180x180">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lifesaving Baden">
    <title>Kontenübersicht - Lifesaving Baden</title>
    <meta property="og:title" content="Kontenübersicht - Lifesaving Baden">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jp-gnad.github.io/Lifesaving-Baden/admin-accounts.html">
    <meta property="og:image" content="https://jp-gnad.github.io/Lifesaving-Baden/assets/img/lifesaving-baden-app-512.png">
    <meta property="og:image:alt" content="Lifesaving Baden Logo auf weißem Hintergrund">
    <link rel="icon" type="image/png" href="assets/img/lifesaving-baden-logo.png">
    <link rel="stylesheet" href="assets/css/styles.css?v=20261112-login-name-v1">
    <link rel="stylesheet" href="assets/css/worktime.css?v=20261106-mobile-zoom-v1">
    <link rel="stylesheet" href="assets/css/mobile-nav.css?v=20261105-menu-navigation-v1">
    <script defer src="assets/js/header.js?v=20261102-header-shadow-v1"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script defer src="assets/js/nav.js?v=20261105-menu-navigation-v3"></script>
    <script defer src="assets/js/firebase-config.js?v=20261101-settings-v11"></script>
    <script defer src="assets/js/clubs-core.js?v=20261112-clubs-v1"></script>
    <script defer src="assets/js/clubs-store.js?v=20261112-orphan-clubs-v2"></script>
    <script defer src="assets/js/person-link-store.js?v=20261112-responsible-v2"></script>
    <script defer src="assets/js/auth-core.js?v=20261112-login-name-v1"></script>
    <script defer src="assets/js/admin-accounts.js?v=20261112-structure-v1"></script>
    <script defer src="assets/js/auth.js?v=20261112-login-name-v1"></script>
  </head>
  <body class="auth-context-loading" data-page="admin-accounts">
    <header class="site-header">
      <a class="brand" href="app.html" aria-label="Lifesaving Baden Mitgliederbereich">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/img/lifesaving-baden-logo.png" alt="">
        </span>
        <span>Lifesaving Baden</span>
      </a>
      <nav class="nav" aria-label="Hauptnavigation">
        <button class="account-trigger" type="button" data-account-open aria-label="Kontoprofil öffnen">
          <span class="account-avatar account-avatar-small">
            <img class="is-hidden" src="" alt="" data-account-photo-small>
            <span data-account-initials-small>?</span>
          </span>
          <span class="account-attention is-hidden" data-account-attention aria-hidden="true">!</span>
          <span class="account-linked is-hidden" data-link-indicator hidden aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </span>
        </button>
      </nav>
    </header>

    <main class="wt-main admin-accounts-main">
      <p class="form-message" data-auth-error role="alert" hidden></p>
      <section class="wt-heading" aria-labelledby="admin-accounts-title">
        <div class="wt-app-title">
          <img src="assets/img/accounts-app.svg" alt="">
          <div><p class="eyebrow">Admin</p><h1 id="admin-accounts-title">Kontenübersicht</h1></div>
        </div>
      </section>
      <section class="admin-account-panel is-hidden" data-admin-only data-admin-accounts aria-label="Konten verwalten">
        <div class="admin-panel-heading">
          <p data-admin-account-summary>Konten werden geladen.</p>
          <button class="button button-secondary" type="button" data-admin-accounts-refresh>Aktualisieren</button>
        </div>
        <label class="admin-account-search">
          Konten suchen
          <input type="search" data-admin-account-search placeholder="E-Mail, Kontoname oder verknüpfte Person" autocomplete="off">
        </label>
        <p class="admin-search-summary" data-admin-account-search-summary role="status"></p>
        <p class="form-message" data-admin-account-message role="status"></p>
        <div class="admin-account-columns" aria-hidden="true"><span>Konto</span><span>Ergebnisdatenbank</span></div>
        <div class="admin-account-list" data-admin-account-list></div>
      </section>
    </main>

    <dialog class="admin-person-dialog" data-admin-person-dialog aria-labelledby="admin-person-title">
      <div class="admin-person-heading">
        <h2 id="admin-person-title">Person verknüpfen</h2>
        <button type="button" class="admin-link-icon-button" data-admin-person-close aria-label="Schließen">×</button>
      </div>
      <p class="admin-person-email" data-admin-person-email></p>
      <label class="admin-account-search">Person suchen
        <input type="search" data-admin-person-search autocomplete="off" maxlength="80" placeholder="Name suchen …">
      </label>
      <p data-admin-person-note role="status">Mindestens 3 Buchstaben eingeben.</p>
      <div class="admin-person-results" data-admin-person-results></div>
      <p class="admin-person-selection" data-admin-person-selection hidden></p>
      <div class="admin-person-actions">
        <button type="button" class="button button-secondary" data-admin-person-close>Abbrechen</button>
        <button type="button" class="button button-primary" data-admin-person-confirm disabled>Verknüpfen</button>
      </div>
    </dialog>

    <footer class="site-footer">
      <span class="footer-brand">
        <img class="moose-icon" src="assets/img/elch-gelb.png" alt="" aria-hidden="true">
        Lifesaving Baden
      </span>
      <nav class="footer-links" aria-label="Fußnavigation">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>

    <div class="account-overlay is-hidden" data-account-overlay aria-hidden="true">
      <section class="account-modal" role="dialog" aria-modal="true" aria-labelledby="account-title">
        <div class="account-modal-header">
          <p class="account-email" data-account-email>Keine E-Mail geladen.</p>
          <button class="account-close" type="button" data-account-close aria-label="Kontofenster schließen">&times;</button>
        </div>

        <div class="account-avatar account-avatar-large">
          <img class="is-hidden" src="" alt="" data-account-photo-large>
          <span data-account-initials-large>?</span>
        </div>

        <h2 id="account-title"><span data-account-greeting-name>Mitglied</span></h2>
        <p class="account-name-line account-role-line">Status: <strong data-account-role>Standard</strong></p>

        <a class="button button-secondary account-manage" href="account-settings.html">
          <svg class="account-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 7h10"></path>
            <path d="M18 7h2"></path>
            <circle cx="16" cy="7" r="2"></circle>
            <path d="M4 17h2"></path>
            <path d="M10 17h10"></path>
            <circle cx="8" cy="17" r="2"></circle>
          </svg>
          <span>Kontoeinstellungen</span>
          <span class="account-manage-attention is-hidden" data-account-manage-attention aria-hidden="true" hidden>!</span>
        </a>

        <div class="account-actions">
          <button class="account-action" type="button" data-logout>
            <svg class="account-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path d="M14 4h4a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-4"></path>
            </svg>
            <span>Abmelden</span>
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
