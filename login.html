<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Login und Registrierung für Lifesaving Baden.">
    <link rel="manifest" href="manifest.webmanifest?v=20261101-project-app-v1">
    <link rel="apple-touch-icon" href="timer/app-icon-180.png?v=baden-brand-v1" sizes="180x180">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lifesaving Baden">
    <title>Login - Lifesaving Baden</title>
    <link rel="icon" type="image/png" href="assets/img/lifesaving-baden-logo.png">
    <script src="assets/js/login-background.js?v=20261102-random-background-v43"></script>
    <link rel="stylesheet" href="assets/css/styles.css?v=20261103-google-button-v66">
    <link rel="stylesheet" href="assets/css/mobile-nav.css?v=20261103-mobile-menu-v58">
    <script defer src="assets/js/header.js?v=20261102-header-shadow-v1"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script defer src="assets/js/nav.js?v=20261103-mobile-menu-v57"></script>
    <script defer src="assets/js/firebase-config.js?v=20261101-settings-v11"></script>
    <script defer src="assets/js/google-handoff.js?v=20261101-settings-v11"></script>
    <script defer src="assets/js/auth-core.js?v=20261101-settings-v11"></script>
    <script defer src="assets/js/login.js?v=20261103-google-button-v50"></script>
  </head>
  <body data-page="login">
    <div class="auth-screen">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="Lifesaving Baden Startseite">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/img/lifesaving-baden-logo.png" alt="">
          </span>
          <span>Lifesaving Baden</span>
        </a>
        <nav class="nav" aria-label="Hauptnavigation">
          <button class="nav-menu-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="main-nav-links" aria-label="Menü öffnen">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </button>
          <div class="nav-links" id="main-nav-links" data-nav-links>
            <a class="nav-button" href="login.html">
              <span class="nav-link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><path d="M10 17l5-5-5-5M15 12H3M14 4h4a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-4"></path></svg>
              </span>
              <span>Anmelden</span>
            </a>
            <a href="timer/#/">
              <span class="nav-link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="13" r="8"></circle><path d="M12 13V9M9 2h6M12 5V2m6 5 1.5-1.5"></path></svg>
              </span>
              <span>Lifesaving Timer</span>
            </a>
            <a href="punkterechner.html">
              <span class="nav-link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 11h1m3 0h1m3 0h.01M8 15h1m3 0h1m3 0h.01M8 18h1m3 0h1m3 0h.01"></path></svg>
              </span>
              <span>Punkterechner</span>
            </a>
            <a href="wettkaempfe.html">
              <span class="nav-link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><path d="M5 21V3m0 1h13l-3 4 3 4H5"></path><path d="M9 4v8m4-8v8M5 8h13"></path></svg>
              </span>
              <span>Wettkämpfe</span>
            </a>
            <a href="rekorde.html">
              <span class="nav-link-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><path d="M8 3h8v6a4 4 0 0 1-8 0V3Zm0 2H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 2v5m-4 3h8m-8 0v-3h8v3"></path></svg>
              </span>
              <span>Rekorde</span>
            </a>
          </div>
        </nav>
      </header>

      <main class="auth-layout">
        <section class="auth-panel" aria-labelledby="auth-title">
          <div class="auth-heading">
            <button class="auth-back" type="button" data-change-email aria-label="Zurück zur E-Mail-Adresse" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 5-7 7 7 7M5 12h14"></path></svg>
            </button>
            <h1 id="auth-title" tabindex="-1">Anmelden</h1>
          </div>

          <form class="auth-form is-email-step" data-auth-form="login">
            <label class="auth-email-step">
              E-Mail
              <input name="email" type="email" autocomplete="email" readonly required>
            </label>
            <label class="auth-password-step">
              Passwort
              <span class="password-field">
                <input name="password" type="password" autocomplete="current-password" minlength="8" readonly required>
                <button class="password-toggle" type="button" data-password-toggle aria-label="Passwort anzeigen" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path class="password-eye-open" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                    <circle class="password-eye-open" cx="12" cy="12" r="2.5"></circle>
                    <path class="password-eye-off" d="M3 3l18 18"></path>
                    <path class="password-eye-off" d="M6.2 6.8C3.8 8.4 2.5 12 2.5 12s3.5 6 9.5 6c1.8 0 3.4-.5 4.7-1.2"></path>
                    <path class="password-eye-off" d="M10.6 6.1c.5-.1.9-.1 1.4-.1 6 0 9.5 6 9.5 6s-.7 1.2-2 2.5"></path>
                  </svg>
                </button>
              </span>
            </label>
            <p class="form-message" data-form-message="login" role="status"></p>
            <button class="button button-primary full-width" type="submit" disabled>Anmelden</button>
            <button class="inline-action" type="button" data-reset-password>
              Passwort vergessen?
            </button>
          </form>

          <div class="auth-divider">
            <span aria-hidden="true"></span>
            <strong>
              <span data-login-divider-copy>oder mit E-Mail-Adresse registrieren</span>
              <span data-login-email-summary hidden></span>
            </strong>
            <span aria-hidden="true"></span>
          </div>

          <div class="auth-google-options">
            <button class="button button-google full-width" type="button" data-google-login>
              <img class="google-logo" src="assets/img/google-g.png" alt="" aria-hidden="true" width="28" height="28">
              <span>Über Google anmelden</span>
            </button>

            <div class="google-identity" data-google-identity hidden>
              <span class="button button-google full-width google-identity-face" aria-hidden="true">
                <img class="google-logo" src="assets/img/google-g.png" alt="" width="28" height="28">
                <span>Über Google anmelden</span>
              </span>
              <div class="google-identity-action" data-google-identity-action></div>
            </div>
          </div>

          <button class="inline-action is-hidden" type="button" data-resend-verification>
            Bestätigungs-Mail erneut senden
          </button>
          <p class="auth-privacy">Indem du fortfährst, stimmst du unserer <a href="datenschutz.html">Datenschutzerklärung</a> zu.</p>
        </section>

        <aside class="auth-aside" aria-hidden="true"></aside>
      </main>
    </div>

    <footer class="site-footer">
      <span class="footer-brand">
        <img class="moose-icon" src="assets/img/elch-gelb.png" alt="" aria-hidden="true">
        Lifesaving Baden
      </span>
      <nav class="footer-links" aria-label="Fußnavigation">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>
  </body>
</html>
