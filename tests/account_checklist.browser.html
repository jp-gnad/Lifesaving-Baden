<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profilfortschritt · Lokale Prüfung</title>
    <style>
      body { margin: 0; background: #08080a; color: white; font: 14px system-ui; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 12px; }
      button { padding: 8px; }
      iframe { display: block; margin: auto; width: 100%; max-width: 100%; height: calc(100vh - 120px); border: 0; }
    </style>
  </head>
  <body>
    <nav>
      <span>Lokale Testdaten</span>
      <button id="toggle-loading">Ladezustand</button>
      <button data-view="app">Übersicht</button>
      <button data-view="settings">Einstellungsmenü</button>
      <button data-state="new">Neues Konto</button>
      <button data-state="partial">Teilweise ergänzt</button>
      <button data-state="requested">Angefragt</button>
      <button data-state="linked">Vollständig verknüpft</button>
      <button data-name="long">Langer Name</button>
      <button data-name="short">Kurzer Name</button>
      <button data-width="100%">Desktop</button>
      <button data-width="390px">390 px</button>
      <button data-width="320px">320 px</button>
    </nav>
    <iframe id="preview" title="Mitgliederübersicht mit Testdaten"></iframe>
    <script>
      document.getElementById("toggle-loading").onclick = () => {
        const page = document.getElementById("preview").contentDocument;
        const loading = page.body.classList.toggle("auth-context-loading");
        page.querySelector("main").toggleAttribute("inert", loading);
        page.querySelector("main").setAttribute("aria-busy", String(loading));
      };
      let selectedState = "new";
      let selectedView = "app";
      let selectedName = "Anna Baden";
      async function loadFixture(state = selectedState, view = selectedView) {
        selectedState = state;
        selectedView = view;
        const response = await fetch(view === "settings" ? "../account-settings.html" : "../app.html");
        const page = new DOMParser().parseFromString(await response.text(), "text/html");
        page.querySelectorAll("script").forEach((script) => {
          if (!/assets\/js\/(collection-pages|club-profile-feed|club-roster-state|admin-notifications|header|dashboard-collection-pages|club-profile-feed|club-roster-state|admin-notifications|header|person-link-store|auth-core|admin-accounts)\.js/.test(script.getAttribute("src") || "")) script.remove();
        });
        const base = page.createElement("base");
        base.href = new URL("../", location.href).href;
        page.head.prepend(base);
        // Disable page initialization: the fixture renders local profile data only.
        page.body.dataset.page = "account-preview";
        const name = { firstName: "Anna", lastName: "Baden" };
        const details = { ...name, dlrgBranch: "Baden", birthDate: "2001-02-03", gender: "weiblich" };
        const profiles = {
          new: name,
          partial: { ...name, dlrgBranch: "Baden" },
          requested: { ...details, personLinkRequest: { status: "requested" } },
          linked: { ...details, personLink: { id: "1234567890abcdef", name: "Anna Baden", birthYear: 2001, gender: "w", organization: "Baden" } },
        };
        const source = await (await fetch("../assets/js/auth.js?v=20261120-role-ui-fix-v1")).text();
        const fixture = page.createElement("script");
        fixture.defer = true;
        // Inline scripts run before deferred dependencies; wait for DOMContentLoaded.
        fixture.textContent = `document.addEventListener("DOMContentLoaded", () => {
          ${source.replace(/\}\)\(\);\s*$/, `
            updateLinkStatusUi(${JSON.stringify(profiles[state])});
            const user = { displayName: ${JSON.stringify(selectedName)}, email: "anna@example.test", providerData: [] };
            updateAccountProfile(user);
            document.querySelector("[data-account-open]").onclick = () => {
              document.querySelector("[data-account-overlay]").classList.remove("is-hidden");
              document.querySelector("[data-account-overlay]").setAttribute("aria-hidden", "false");
            };
            document.querySelector("[data-account-close]").onclick = () => {
              document.querySelector("[data-account-overlay]").classList.add("is-hidden");
              document.querySelector("[data-account-overlay]").setAttribute("aria-hidden", "true");
            };
            document.body.classList.remove("auth-context-loading");
    document.querySelector("main")?.removeAttribute("inert");
    document.querySelector("main")?.setAttribute("aria-busy", "false");
            document.body.dataset.page = ${JSON.stringify(view)};
            if (${JSON.stringify(view)} === "settings") {
              const form = document.querySelector("[data-profile-form]");
              Object.entries(${JSON.stringify(profiles[state])}).forEach(([key, value]) => {
                if (form.elements[key]) form.elements[key].value = value;
              });
              form.dataset.profileDetailsLoaded = "true";
              updateProfileFieldList(form);
              initSettingsMenu();
            }
          })();`)}
        });`;
        page.head.append(fixture);
        document.getElementById("preview").srcdoc = "<!doctype html>" + page.documentElement.outerHTML;
      }
      loadFixture();
      document.querySelectorAll("[data-state]").forEach((button) => {
        button.onclick = () => loadFixture(button.dataset.state);
      });
      document.querySelectorAll("[data-view]").forEach((button) => {
        button.onclick = () => loadFixture(selectedState, button.dataset.view);
      });
      document.querySelectorAll("[data-name]").forEach((button) => {
        button.onclick = () => {
          selectedName = button.dataset.name === "long" ? "Anna-Lena Maximiliane von Baden-Württemberg" : "Anna Baden";
          loadFixture();
        };
      });
      document.querySelectorAll("[data-width]").forEach((button) => {
        button.onclick = () => { document.getElementById("preview").style.width = button.dataset.width; };
      });
    </script>
  </body>
</html>
