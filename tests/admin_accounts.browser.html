<!doctype html>
<html lang="de">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konten · Lokale Prüfung</title>
    <style>body{margin:0;background:#08080a;color:white;font:14px system-ui}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:12px}button{padding:8px}iframe{display:block;margin:auto;width:100%;max-width:100%;height:calc(100vh - 70px);border:0}</style>
  </head>
  <body>
    <nav><span>Lokale Testdaten · Änderungen bleiben im Speicher</span><button data-width="100%">Desktop</button><button data-width="390px">Mobil · 390 px</button><button data-width="320px">320 px</button></nav>
    <iframe id="preview" title="Kontenübersicht mit Testdaten"></iframe>
    <script>
      (async () => {
        const response = await fetch("../admin-accounts.html");
        const page = new DOMParser().parseFromString(await response.text(), "text/html");
        page.querySelectorAll("script").forEach((script) => {
          if (!/assets\/js\/(header|person-link-store|auth-core|admin-accounts)\.js/.test(script.getAttribute("src") || "")) script.remove();
        });
        const base = page.createElement("base");
        base.href = new URL("../", location.href).href;
        page.head.prepend(base);
        const fixture = page.createElement("script");
        fixture.src = "tests/admin-accounts-fixture.js";
        fixture.defer = true;
        page.head.append(fixture);
        document.getElementById("preview").srcdoc = "<!doctype html>" + page.documentElement.outerHTML;
      })();
      document.querySelectorAll("[data-width]").forEach((button) => button.onclick = () => { document.getElementById("preview").style.width = button.dataset.width; });
    </script>
  </body>
</html>
