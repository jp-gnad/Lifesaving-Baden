<!doctype html>
<html lang="de">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mitgliederstart · Lokale Prüfung</title>
    <style>body{margin:0;background:#08080a;color:white;font:14px system-ui}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px}button{padding:8px}iframe{display:block;margin:auto;width:100%;max-width:100%;height:calc(100vh - 90px);border:0}</style>
  </head>
  <body>
    <nav aria-label="Lokale Testseiten"><span>Lokale Admin-Testdaten · echter Seitenstart · ohne Firebase</span>
      <button data-page="app.html">Übersicht</button><button data-page="account-settings.html">Einstellungen</button>
      <button data-page="admin-accounts.html">Konten</button><button data-page="gliederungen.html">Gliederungen</button>
      <button data-page="club-verwaltung.html">Clubverwaltung</button><button data-page="arbeitszeiten.html">Arbeitszeiten</button>
      <button data-width="100%">Desktop</button><button data-width="390px">390 px</button>
    </nav>
    <iframe id="preview" title="Mitgliederbereich mit simuliertem Firebase"></iframe>
    <script>
      const allowed = new Set([...document.querySelectorAll("[data-page]")].map((button) => button.dataset.page));
      async function loadMemberFixture(file = "app.html") {
        if (!allowed.has(file)) return;
        const page = new DOMParser().parseFromString(await (await fetch(`../${file}`)).text(), "text/html");
        // Keep the exact local production module list, including auth.js itself.
        page.querySelectorAll("script[src]").forEach((script) => {
          const src = script.getAttribute("src");
          if (/^https?:/.test(src) || /firebase-config\.js/.test(src)) script.remove();
        });
        const base = page.createElement("base"); base.href = new URL("../", location.href).href;
        const fixture = page.createElement("script"); fixture.src = "tests/member-bootstrap-fixture.js?v=20261124-overview-v1";
        page.head.prepend(base, fixture);
        document.getElementById("preview").srcdoc = "<!doctype html>" + page.documentElement.outerHTML;
      }
      document.querySelectorAll("[data-page]").forEach((button) => button.onclick = () => loadMemberFixture(button.dataset.page));
      document.querySelectorAll("[data-width]").forEach((button) => button.onclick = () => { document.getElementById("preview").style.width = button.dataset.width; });
      const options = new URLSearchParams(location.search);
      if (["390", "320"].includes(options.get("width"))) document.getElementById("preview").style.width = `${options.get("width")}px`;
      loadMemberFixture(options.get("page") || "app.html");
    </script>
  </body>
</html>
