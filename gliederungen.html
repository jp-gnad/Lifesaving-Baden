<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f0f12">
    <meta name="color-scheme" content="dark">
    <title>Gliederungen · Lifesaving Baden</title>
    <meta property="og:title" content="Gliederungen · Lifesaving Baden">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://jp-gnad.github.io/Lifesaving-Baden/assets/img/lifesaving-baden-app-512.png">
    <link rel="icon" type="image/png" href="assets/img/lifesaving-baden-logo.png">
    <link rel="manifest" href="manifest.webmanifest?v=20261105-baden-icon-v2">
    <link rel="apple-touch-icon" href="assets/img/lifesaving-baden-app-180.png" sizes="180x180">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lifesaving Baden">
    <link rel="stylesheet" href="assets/css/styles.css?v=20261112-login-name-v1">
    <link rel="stylesheet" href="assets/css/worktime.css?v=20261106-mobile-zoom-v1">
    <link rel="stylesheet" href="assets/css/start-eligibility.css?v=20261110-compact-v1">
    <link rel="stylesheet" href="assets/css/clubs.css?v=20261112-orphan-clubs-v2">
    <script defer src="assets/js/header.js?v=20261102-header-shadow-v1"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script defer src="assets/js/firebase-config.js?v=20261101-settings-v11"></script>
    <script defer src="assets/js/clubs-core.js?v=20261112-clubs-v1"></script>
    <script defer src="assets/js/person-link-store.js?v=20261112-settings-links-v1"></script>
    <script defer src="assets/js/auth-core.js?v=20261112-settings-links-v1"></script>
    <script defer src="assets/js/start-eligibility-core.js?v=20261112-clubs-v1"></script>
    <script defer src="assets/js/clubs-store.js?v=20261112-orphan-clubs-v2"></script>
    <script defer src="assets/js/clubs.js?v=20261112-orphan-clubs-v2"></script>
    <script defer src="assets/js/admin-accounts.js?v=20261112-structure-v1"></script>
    <script defer src="assets/js/auth.js?v=20261112-settings-links-v1"></script>
  </head>
  <body class="auth-context-loading" data-page="gliederungen">
    <header class="site-header">
      <a class="brand" href="app.html" aria-label="Zum Mitgliederbereich">
        <span class="brand-mark"><img src="assets/img/lifesaving-baden-logo.png" alt=""></span>
        <span>Lifesaving Baden</span>
      </a>
      <nav class="nav" aria-label="Kontonavigation">
        <button class="account-trigger" type="button" data-account-open aria-label="Kontoprofil öffnen">
          <span class="account-avatar account-avatar-small">
            <img class="is-hidden" src="" alt="" data-account-photo-small>
            <span data-account-initials-small>?</span>
          </span>
          <span class="account-attention is-hidden" data-account-attention aria-hidden="true">!</span>
          <span class="account-linked is-hidden" data-link-indicator hidden aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </span>
        </button>
      </nav>
    </header>

    <main class="wt-main se-main">
      <p class="form-message" data-auth-error role="alert" hidden></p>
      <p class="wt-message" id="club-message" role="status" hidden></p>
      <div id="se-content" hidden>
        <section class="wt-heading">
          <div class="wt-app-title"><img src="assets/img/clubs-admin-app.svg?v=20261112-red-v1" alt=""><div><p class="eyebrow">Admin</p><h1>Gliederungen</h1></div></div>
          <button class="button se-primary se-import" id="club-create-open" type="button" aria-label="Gliederung erstellen" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Erstellen</span></button>
        </section>
        <div id="se-list" aria-busy="true"><p class="wt-empty" role="status">Gliederungen werden geladen …</p></div>
      </div>
    </main>

    <footer class="site-footer"><span class="footer-brand"><img class="moose-icon" src="assets/img/elch-gelb.png" alt="">Lifesaving Baden</span><nav class="footer-links" aria-label="Fußnavigation"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></nav></footer>

    <dialog class="wt-dialog se-dialog" id="club-create-dialog" aria-labelledby="club-create-title">
      <form id="club-create-form">
        <div class="wt-dialog-heading"><h2 id="club-create-title">Gliederung erstellen</h2><button class="wt-icon-button" type="button" data-club-close aria-label="Schließen">×</button></div>
        <fieldset class="se-season-switch" aria-label="Gliederung importieren oder neu erstellen">
          <label><input class="wt-sr-only" type="radio" name="club-source" value="import" checked><span>Importieren</span></label>
          <label><input class="wt-sr-only" type="radio" name="club-source" value="new"><span>Neu</span></label>
        </fieldset>
        <label class="wt-field"><span>Gliederung</span><input id="club-name" type="search" maxlength="120" required autocomplete="off" placeholder="Name suchen …"></label>
        <div id="club-name-results" class="se-search-results"></div>
        <label class="wt-field"><span>Verantwortlich</span><input id="club-manager-search" type="search" maxlength="120" autocomplete="off" placeholder="Trainer, Organisator oder Admin suchen …"></label>
        <div id="club-manager-results" class="se-search-results"></div>
        <p class="wt-form-error" id="club-create-error" role="alert" hidden></p>
        <div class="wt-dialog-actions"><button class="button se-primary" id="club-create-submit" type="submit" disabled>Erstellen</button></div>
      </form>
    </dialog>

    <dialog class="wt-dialog se-dialog" id="club-responsible-dialog" aria-labelledby="club-responsible-title">
      <div class="wt-dialog-heading"><h2 id="club-responsible-title"></h2><button class="wt-icon-button" type="button" data-club-close aria-label="Schließen">×</button></div>
      <p class="se-meta">Verantwortliche</p>
      <div id="club-responsible-members"></div>
      <p class="se-meta" id="club-responsible-note" hidden>Bitte einen Verantwortlichen neu bestätigen.</p>
      <label class="wt-field"><span>Hinzufügen</span><input id="club-responsible-search" type="search" maxlength="120" autocomplete="off" placeholder="Trainer, Organisator oder Admin suchen …"></label>
      <div class="se-search-results" id="club-responsible-results"></div>
      <p class="wt-form-error" id="club-responsible-error" role="alert" hidden></p>
    </dialog>

    <div class="account-overlay is-hidden" data-account-overlay aria-hidden="true">
      <section class="account-modal" role="dialog" aria-modal="true" aria-labelledby="account-title">
        <div class="account-modal-header"><p class="account-email" data-account-email></p><button class="account-close" type="button" data-account-close aria-label="Kontofenster schließen">×</button></div>
        <div class="account-avatar account-avatar-large"><img class="is-hidden" src="" alt="" data-account-photo-large><span data-account-initials-large>?</span></div>
        <h2 id="account-title"><span data-account-greeting-name>Mitglied</span></h2>
        <p class="account-name-line account-role-line">Status: <strong data-account-role></strong></p>
        <a class="button button-secondary account-manage" href="account-settings.html">
          <svg class="account-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
          <span>Kontoeinstellungen</span><span class="account-manage-attention is-hidden" data-account-manage-attention aria-hidden="true" hidden>!</span>
        </a>
        <div class="account-actions"><button class="account-action" type="button" data-logout>Abmelden</button></div>
      </section>
    </div>
  </body>
</html>
